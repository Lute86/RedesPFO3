services:

  # ────────────────────────────────────────────────
  # PostgreSQL — puerto host 5433 (evita conflicto con 5432 local)
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pfo3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pfo3user
      POSTGRES_PASSWORD: pfo3pass
      POSTGRES_DB: pfo3
    ports:
      - "5433:5432"           # host:5433 → container:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfo3user -d pfo3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────
  # RabbitMQ — AMQP 5673, management UI 15673
  # (evita conflictos con 5672 y 15672 locales)
  # ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pfo3_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pfo3user
      RABBITMQ_DEFAULT_PASS: pfo3pass
    ports:
      - "5673:5672"           # host:5673 → container:5672 (AMQP)
      - "15673:15672"         # host:15673 → container:15672 (management UI)
    volumes:
      - rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ────────────────────────────────────────────────
  # Servidor worker 1 — puerto host 5101
  # ────────────────────────────────────────────────
  servidor_1:
    build: .
    container_name: pfo3_servidor_1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5100"
      NUM_WORKERS: "4"
      QUEUE_NAME: tareas
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"       # interno: container-to-container usa el puerto real
      RABBIT_USER: pfo3user
      RABBIT_PASS: pfo3pass
      PG_HOST: postgres
      PG_PORT: "5432"           # interno
      PG_DB: pfo3
      PG_USER: pfo3user
      PG_PASS: pfo3pass
    ports:
      - "5101:5100"             # host:5101 → container:5100

  # ────────────────────────────────────────────────
  # Servidor worker 2 — puerto host 5102
  # ────────────────────────────────────────────────
  servidor_2:
    build: .
    container_name: pfo3_servidor_2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5100"
      NUM_WORKERS: "4"
      QUEUE_NAME: tareas
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: pfo3user
      RABBIT_PASS: pfo3pass
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: pfo3
      PG_USER: pfo3user
      PG_PASS: pfo3pass
    ports:
      - "5102:5100"             # host:5102 → container:5100

  # ────────────────────────────────────────────────
  # Nginx — balanceador de carga, puerto host 5100
  # ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pfo3_nginx
    restart: unless-stopped
    depends_on:
      - servidor_1
      - servidor_2
    ports:
      - "5100:5100"             # host:5100 → nginx:5100 (entrada pública)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:
  rmq_data:
