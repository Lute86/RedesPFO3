services:

  # ────────────────────────────────────────────────
  # PostgreSQL — puerto host 5433 (evita conflicto con 5432 local)
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pfo3flask_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pfo3user
      POSTGRES_PASSWORD: pfo3pass
      POSTGRES_DB: pfo3
    ports:
      - "5433:5432"           # host:5433 → container:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfo3user -d pfo3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────
  # RabbitMQ — AMQP 5673, management UI 15673
  # ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pfo3flask_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pfo3user
      RABBITMQ_DEFAULT_PASS: pfo3pass
    ports:
      - "5673:5672"           # host:5673 → container:5672 (AMQP)
      - "15673:15672"         # host:15673 → container:15672 (management UI)
    volumes:
      - rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ────────────────────────────────────────────────
  # Servidor Flask 1 — puerto host 5001 (debug directo)
  # ────────────────────────────────────────────────
  servidor_1:
    build: .
    container_name: pfo3flask_servidor_1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5000"
      NUM_WORKERS: "4"
      QUEUE_NAME: tareas
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: pfo3user
      RABBIT_PASS: pfo3pass
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: pfo3
      PG_USER: pfo3user
      PG_PASS: pfo3pass
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

  # ────────────────────────────────────────────────
  # Servidor Flask 2 — puerto host 5002 (debug directo)
  # ────────────────────────────────────────────────
  servidor_2:
    build: .
    container_name: pfo3flask_servidor_2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5000"
      NUM_WORKERS: "4"
      QUEUE_NAME: tareas
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: pfo3user
      RABBIT_PASS: pfo3pass
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: pfo3
      PG_USER: pfo3user
      PG_PASS: pfo3pass
    ports:
      - "5002:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

  # ────────────────────────────────────────────────
  # Nginx — balanceador HTTP, puerto host 5000 (entrada pública)
  # ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pfo3flask_nginx
    restart: unless-stopped
    depends_on:
      servidor_1:
        condition: service_healthy
      servidor_2:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:
  rmq_data:
