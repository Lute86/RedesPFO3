# nginx.conf — balanceador HTTP para las dos instancias de server.py
# Distribuye peticiones entrantes en :5000 entre servidor_1 y servidor_2

worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    upstream flask_pool {
        least_conn;
        server servidor_1:5000;
        server servidor_2:5000;
    }

    server {
        listen 5000;

        location / {
            proxy_pass         http://flask_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }
    }
}
